  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: house-booker-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8090"                         # ← accessible via IP:8090
    environment:
      KAFKA_CLUSTERS_0_NAME: house-booker-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - house-booker-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: house-booker-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - house-booker-network

  eureka-server:
    image: ghcr.io/${GHCR_OWNER}/house-booker-eureka-server:${IMAGE_TAG}
    container_name: house-booker-eureka-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8761
      HOST_PRIVATE_IP: ${EC2_1_PRIVATE_IP}
      EUREKA_INSTANCE_IP_ADDRESS: ${EC2_1_PRIVATE_IP}
    ports:
      - "8761:8761"
    networks:
      - house-booker-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || curl -fsS http://localhost:8761/"]
      interval: 20s
      timeout: 10s
      retries: 20

  api-gateway:
    image: ghcr.io/${GHCR_OWNER}/house-booker-api-gateway:${IMAGE_TAG}
    container_name: house-booker-api-gateway
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 8080
      HOST_PRIVATE_IP: ${EC2_1_PRIVATE_IP}
      EUREKA_INSTANCE_IP_ADDRESS: ${EC2_1_PRIVATE_IP}
    ports:
      - "80:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - house-booker-network

  auth-service:
    image: ghcr.io/${GHCR_OWNER}/house-booker-auth-service:${IMAGE_TAG}
    container_name: house-booker-auth-service
    restart: unless-stopped
    environment:
      <<: *common-env
      SERVER_PORT: 3001
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      HOST_PRIVATE_IP: ${EC2_1_PRIVATE_IP}
      EUREKA_INSTANCE_IP_ADDRESS: ${EC2_1_PRIVATE_IP}
    ports:
      - "3001:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - house-booker-network
