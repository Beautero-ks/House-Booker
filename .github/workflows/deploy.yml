name: Deploy House-Booker

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FRONTEND_DIR: frontend

jobs:

  build-backend-images:
    name: Build and Push Backend Images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - booking-service
          - house-service
          - notification-service
          - eureka-server
          - api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./backend/${{ matrix.service }}
          file: ./backend/${{ matrix.service }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ secrets.GHCR_OWNER }}/house-booker-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ secrets.GHCR_OWNER }}/house-booker-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend-vercel:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: build-backend-images

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        working-directory: ${{ env.FRONTEND_DIR }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel build variables
        working-directory: ${{ env.FRONTEND_DIR }}
        run: vercel env pull .env.production.local --environment=production --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || '13.51.109.43' }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-ec2-1:
    name: Deploy EC2-1
    runs-on: ubuntu-latest
    needs: build-backend-images

    steps:
      - name: Configure SSH for EC2-1
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_1_SSH_KEY }}" > ~/.ssh/ec2_1_key
          chmod 600 ~/.ssh/ec2_1_key
          ssh-keyscan -H "${{ secrets.EC2_1_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy services on EC2-1
        run: |
          ssh -i ~/.ssh/ec2_1_key "${{ secrets.EC2_1_USER }}@${{ secrets.EC2_1_HOST }}" << EOF
            set -e

            APP_DIR="/opt/House-Booker"

            echo "Connexion EC2-1 réussie"

            if [ ! -d "\$APP_DIR" ]; then
              echo "Le dossier \$APP_DIR n'existe pas sur EC2-1"
              exit 1
            fi

            cd "\$APP_DIR"

            echo "Mise à jour du projet sur EC2-1"
            git fetch origin
            git checkout develop
            git pull origin develop

            echo "Connexion à GHCR"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_OWNER }}" --password-stdin

            echo "Déploiement EC2-1 avec tag ${{ github.sha }}"

            export GHCR_OWNER="${{ secrets.GHCR_OWNER }}"
            export IMAGE_TAG="${{ github.sha }}"

            docker compose --env-file .env.ec2-1 -f docker-compose.ec2-1.yml pull
            docker compose --env-file .env.ec2-1 -f docker-compose.ec2-1.yml up -d --remove-orphans

            docker image prune -f

            docker compose --env-file .env.ec2-1 -f docker-compose.ec2-1.yml ps
          EOF

  deploy-ec2-2:
    name: Deploy EC2-2
    runs-on: ubuntu-latest
    needs:
      - build-backend-images
      - deploy-ec2-1

    steps:
      - name: Configure SSH for EC2-2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_2_SSH_KEY }}" > ~/.ssh/ec2_2_key
          chmod 600 ~/.ssh/ec2_2_key
          ssh-keyscan -H "${{ secrets.EC2_2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy services on EC2-2
        run: |
          ssh -i ~/.ssh/ec2_2_key "${{ secrets.EC2_2_USER }}@${{ secrets.EC2_2_HOST }}" << EOF
            set -e

            APP_DIR="/opt/House-Booker"

            echo "Connexion EC2-2 réussie"

            if [ ! -d "\$APP_DIR" ]; then
              echo "Le dossier \$APP_DIR n'existe pas sur EC2-2"
              exit 1
            fi

            cd "\$APP_DIR"

            echo "Mise à jour du projet sur EC2-2"
            git fetch origin
            git checkout develop
            git pull origin develop

            echo "Connexion à GHCR"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_OWNER }}" --password-stdin

            echo "Déploiement EC2-2 avec tag ${{ github.sha }}"

            export GHCR_OWNER="${{ secrets.GHCR_OWNER }}"
            export IMAGE_TAG="${{ github.sha }}"

            docker compose --env-file .env.ec2-2 -f docker-compose.ec2-2.yml pull
            docker compose --env-file .env.ec2-2 -f docker-compose.ec2-2.yml up -d --remove-orphans

            docker image prune -f

            docker compose --env-file .env.ec2-2 -f docker-compose.ec2-2.yml ps
          EOF
