# =====================================================
# Test Configuration - application-test.yml
# =====================================================
# 
# This configuration is used when running tests.
# It overrides the main application.yml settings.
# Uses an in-memory database so tests do not depend on local infrastructure.
#

spring:
  datasource:
    url: jdbc:h2:mem:notification_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  # JPA settings for tests
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  
  flyway:
    enabled: false
  
  # Redis - use embedded or mock in tests
  data:
    redis:
      host: localhost
      port: 6379
  
  # Kafka - disable for unit tests
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      auto-create: false
    listener:
      auto-startup: false
    consumer:
      auto-offset-reset: earliest
      group-id: test-group

# Disable scheduled tasks during tests
notification:
  rate-limit:
    email: 10
    sms: 5
    push: 20
    in-app: 100
  retry:
    check-interval-ms: 9999999  # Effectively disable
    stuck-check-interval-ms: 9999999
  dedupe:
    ttl-seconds: 3600  # Shorter TTL for tests (1 hour)
  kafka:
    topic: test-notifications

# Reduce logging noise during tests
logging:
  level:
    root: WARN
    com.notification: INFO
    org.springframework: WARN
