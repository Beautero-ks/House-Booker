spring:
  datasource:
    url: jdbc:h2:mem:booking_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  kafka:
    bootstrap-servers: localhost:29092
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false

house-service:
  url: http://localhost:8083
