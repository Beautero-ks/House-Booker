spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://localhost:8888

  # ===== POSTGRESQL =====
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ===== GRAPHQL =====
  graphql:
    graphiql:
      enabled: true
    path: /graphql
    schema:
      printer:
        enabled: true

  # ===== KAFKA =====
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000

  # ===== OAUTH2 =====
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub

# ===== SERVER =====
server:
  port: ${SERVER_PORT:3001}

# ===== LOGGING =====
logging:
  level:
    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR

# ===== EUREKA =====
eureka:
  client:
    enabled: false
    fetch-registry: false
    register-with-eureka: false

# ===== JWT =====
jwt:
  secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

# ===== OTP =====
otp:
  expiration-minutes: 10

# ===== KAFKA TOPICS =====
kafka:
  topics:
    user-created: user.created

# ===== CORS =====
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

google:
  client-id: ${GOOGLE_CLIENT_ID:361819434983-cm1se6aefolqdhc0hashnkh6v9rg5ut6.apps.googleusercontent.com}
  client-secret: ${GOOGLE_CLIENT_SECRET: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m1l1k1j1i1h1g1f1e1d1c1b1a}