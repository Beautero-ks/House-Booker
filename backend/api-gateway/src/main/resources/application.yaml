server:
  port: 8083

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # Définition explicite des routes (Rattaché directement à 'gateway')
      routes:
        # Routes publiques exposées au frontend Vercel
        - id: auth-service-api-graphql-route
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/graphql
          filters:
            - RewritePath=/api/auth/graphql, /graphql

        - id: house-service-api-graphql-route
          uri: lb://house-service
          predicates:
            - Path=/api/houses/graphql
          filters:
            - JwtAuthenticationFilter
            - RewritePath=/api/houses/graphql, /graphql

        - id: booking-service-api-graphql-route
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/graphql
          filters:
            - JwtAuthenticationFilter
            - RewritePath=/api/bookings/graphql, /graphql

        - id: notification-service-api-route
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuthenticationFilter
            - RewritePath=/api/notifications(?<segment>/?.*), /api/v1/notifications$\{segment}

        # Route pour le Auth-Service
        - id: auth-service-public-route
          uri: lb://auth-service
          predicates:
            - Path=/graphql/auth, /graphql/auth/**
          filters:
            - RewritePath=/graphql/auth(?<segment>/?.*), /graphql$\{segment}

        # Route pour le User-Service
        - id: user-service-protected-route
          uri: lb://user-service
          predicates:
            - Path=/graphql/user/**
          filters:
            - JwtAuthenticationFilter
            - RewritePath=/graphql/user(?<segment>/?.*), /graphql$\{segment}

        # Route pour le House-Service
        - id: house-service-protected-route
          uri: lb://house-service
          predicates:
            - Path=/graphql/house, /graphql/house/**
          filters:
            - JwtAuthenticationFilter
            - RewritePath=/graphql/house(?<segment>/?.*), /graphql$\{segment}

        # Route pour le Booking-Service
        - id: booking-service-protected-route
          uri: lb://booking-service
          predicates:
            - Path=/graphql/booking, /graphql/booking/**
          filters:
            - JwtAuthenticationFilter
            - RewritePath=/graphql/booking(?<segment>/?.*), /graphql$\{segment}

        # Route pour le Review-Service
        - id: review-service-protected-route
          uri: lb://review-service
          predicates:
            - Path=/graphql/api/v1/review/**
          filters:
            - JwtAuthenticationFilter
            - RewritePath=/graphql/review(?<segment>/?.*), /graphql$\{segment}

        # Route pour le Payment-Service
        - id: payment-service-protected-route
          uri: lb://payment-service
          predicates:
            - Path=/graphql/api/v1/payment/**
          filters:
            - JwtAuthenticationFilter
            - RewritePath=/graphql/payment(?<segment>/?.*), /graphql$\{segment}

        # Route pour le Notification-Service
        - id: notification-service-protected-route
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notification/**, /api/v1/notifications/**
          filters:
            - JwtAuthenticationFilter


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: ${EUREKA_INSTANCE_IP_ADDRESS:${HOST_PRIVATE_IP:127.0.0.1}}


