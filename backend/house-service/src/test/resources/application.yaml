spring:
  cloud:
    discovery:
      enabled: false
    inetutils:
      default-hostname: localhost
      default-ip-address: 127.0.0.1
  datasource:
    url: jdbc:h2:mem:house_service_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  docker:
    compose:
      enabled: false

eureka:
  client:
    enabled: false
