spring:
  application:
    name: house-service

  datasource:
    url: jdbc:postgresql://localhost:5432/db_logements
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

  # Configuration pour les uploads de fichiers
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  # Configuration GraphQL
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    websocket:
      path: /graphql/websocket

server:
  port: 8083

  servlet:
    context-path: /api/v1

# Logging
logging:
  level:
    com.intergiciel.house_service: DEBUG
    org.springframework.graphql: DEBUG
